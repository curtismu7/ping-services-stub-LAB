name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install
      - run: SERVICE_MODE=mock STANDALONE_ENV=/nonexistent/.env node --test test/*.test.js
      # The vendored shared stylesheet must match the hash pinned when it was last re-vendored.
      - run: bash scripts/check-ui-standard.sh
      - name: gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --redact --verbose

  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          if grep -rInE "cmuir_pingcorp|AI-DEMO2/" --include='*.js' --include='*.mjs' --include='*.jsx' --include='*.json' --include='*.md' --exclude=CLAUDE.md . ; then
            echo "Forbidden identifier found (cross-repo import or wrong owner)"; exit 1
          fi
      - name: No AI attribution in the tree or recent commits
        run: bash scripts/check-no-ai-attribution.sh

  e2e:
    # Playwright 1.58.2 (locked) cannot install browser deps on the ubuntu-latest (26.04) image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-screenshots
      - name: Screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            ${{ runner.temp }}/e2e-screenshots
            .data/e2e-screenshots
            e2e-output
          retention-days: 7
